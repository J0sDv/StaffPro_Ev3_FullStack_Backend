server.port=3003
spring.application.name=ms-solicitudes

spring.datasource.url=jdbc:h2:file:./data/solicitudes;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Direccion de ms-personal (lo consulta la regla de disponibilidad)
personal.url=${PERSONAL_URL:http://127.0.0.1:3001}

springdoc.swagger-ui.path=/swagger-ui.html
