server.port=3002
spring.application.name=ms-usuarios

spring.datasource.url=jdbc:h2:file:./data/usuarios;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

jwt.secret=${JWT_SECRET:staffpro-clave-solo-para-desarrollo-local-32bytes!!}
jwt.expiracion-minutos=60

springdoc.swagger-ui.path=/swagger-ui.html